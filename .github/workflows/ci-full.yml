name: Full CI

on:
  pull_request:
    # Reapply full-ci after a new push; a retained label is not a request.
    types: [labeled]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Unrelated labels also trigger this workflow, before the job-level if is evaluated.
  group: full-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Full CI
    # A skipped CALL does not create the protected job in the reusable workflow.
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    uses: ./.github/workflows/ci-checks.yml
    with:
      full: true
      historical_migrations: true

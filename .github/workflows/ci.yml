name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_COMPOSE: docker compose
  COMPOSE_DEV_FILES: -f docker-compose.dev.yml
  COMPOSE_INFRA_FILES: -f docker-compose.infra.yml -f docker-compose.ci.yml

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: eceeev4ci-${{ github.run_id }}-${{ github.run_attempt }}-backendlint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare CI environment
        run: |
          cp .env.template .env
          cat >> .env <<'EOF'
          AWS_S3_ENDPOINT_URL=http://minio:9000
          AWS_S3_INTERNAL_ENDPOINT_URL=http://minio:9000
          IMGPROXY_URL=http://imgproxy:8080
          IMGPROXY_PUBLIC_URL=http://localhost:8080
          EOF

      - name: Run backend lint
        run: make backend-lint

      - name: Clean up Docker resources
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v --remove-orphans

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: eceeev4ci-${{ github.run_id }}-${{ github.run_attempt }}-backendtests
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI environment
        run: |
          cp .env.template .env
          cat >> .env <<'EOF'
          AWS_S3_ENDPOINT_URL=http://minio:9000
          AWS_S3_INTERNAL_ENDPOINT_URL=http://minio:9000
          IMGPROXY_URL=http://imgproxy:8080
          IMGPROXY_PUBLIC_URL=http://localhost:8080
          EOF

      - name: Run backend tests
        run: make backend-test

      - name: Clean up Docker resources
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml down -v --remove-orphans
          docker compose -f docker-compose.infra.yml -f docker-compose.ci.yml down -v --remove-orphans

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: eceeev4ci-${{ github.run_id }}-${{ github.run_attempt }}-frontendtests
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI environment
        run: |
          cp .env.template .env
          cat >> .env <<'EOF'
          AWS_S3_ENDPOINT_URL=http://minio:9000
          AWS_S3_INTERNAL_ENDPOINT_URL=http://minio:9000
          IMGPROXY_URL=http://imgproxy:8080
          IMGPROXY_PUBLIC_URL=http://localhost:8080
          EOF

      - name: Run frontend unit tests
        run: make frontend-test

      - name: Clean up Docker resources
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml down -v --remove-orphans
          docker compose -f docker-compose.infra.yml -f docker-compose.ci.yml down -v --remove-orphans

  frontend-e2e:
    name: Frontend Playwright
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: eceeev4ci-${{ github.run_id }}-${{ github.run_attempt }}-frontende2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare CI environment
        run: |
          cp .env.template .env
          cat >> .env <<'EOF'
          AWS_S3_ENDPOINT_URL=http://minio:9000
          AWS_S3_INTERNAL_ENDPOINT_URL=http://minio:9000
          IMGPROXY_URL=http://imgproxy:8080
          IMGPROXY_PUBLIC_URL=http://localhost:8080
          EOF

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend Playwright tests
        run: make frontend-e2e-test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Clean up Docker resources
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml down -v --remove-orphans
          docker compose -f docker-compose.infra.yml -f docker-compose.ci.yml down -v --remove-orphans

name: Tag on Merge

on:
  push:
    branches:
      - main  # or 'master' — change to match your default branch

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  create-tag:
    if: github.event.head_commit.message != ''  # Optional safeguard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history including tags

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get highest version tag
        id: get_tag
        run: |
          # Get all tags, filter for semantic version format, and find the highest one
          HIGHEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
          if [ -z "$HIGHEST_TAG" ]; then
            HIGHEST_TAG="v0.0.0"
          fi
          echo "latest_tag=$HIGHEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Found highest version tag: $HIGHEST_TAG"

      - name: Select next release version
        id: bump_version
        env:
          LATEST_TAG: ${{ steps.get_tag.outputs.latest_tag }}
        run: |
          OLD=$LATEST_TAG
          echo "Current highest version: $OLD"
          
          # Remove 'v' prefix and split version
          OLD=${OLD#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          
          # Start the 0.1 series on this merge, then resume normal patch releases.
          if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -eq 0 ]; then
            MINOR=1
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version will be: $NEW_TAG"
           
      - name: Push release tag
        env:
          NEW_TAG: ${{ steps.bump_version.outputs.new_tag }}
        run: |
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

permissions:
  contents: write

name: Optional browser regression tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: optional-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-admin-e2e:
    name: Frontend admin Playwright
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run admin Playwright tests
        working-directory: frontend
        run: npm run test:e2e:admin

      - name: Run isolated pilot browser baseline
        working-directory: frontend
        run: npx playwright test --config playwright.pilot.config.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-admin-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/pilot/
          if-no-files-found: ignore


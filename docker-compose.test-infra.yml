services:
  test-db:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: eceee_v4_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eceee_v4_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test-redis:
    image: redis:7.4-alpine
    restart: "no"
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  test-minio:
    # MinIO no longer publishes public pre-built images. Coollabs builds this
    # multi-architecture image from the official release source; pin the OCI
    # index digest so local and CI tests use identical bits.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    restart: "no"
    environment:
      MINIO_ROOT_USER: test-eceee
      MINIO_ROOT_PASSWORD: test-eceee-secret
    command: server /data
    volumes:
      - test_minio_data:/data
    healthcheck:
      # The source-built image is intentionally minimal and does not include
      # curl. Bash's TCP socket support keeps the readiness probe self-contained.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ \"$$status\" == *'200 OK'* ]]",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  test-minio-init:
    # The upstream minio/mc container repository was retired. Use the supported,
    # pinned AWS CLI image to configure the S3-compatible test service instead.
    image: amazon/aws-cli:2.31.13
    restart: "no"
    depends_on:
      test-minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test-eceee
      AWS_SECRET_ACCESS_KEY: test-eceee-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        endpoint=http://test-minio:9000
        aws --endpoint-url "$$endpoint" s3api head-bucket --bucket eceee-media >/dev/null 2>&1 || \
          aws --endpoint-url "$$endpoint" s3api create-bucket --bucket eceee-media >/dev/null
        aws --endpoint-url "$$endpoint" s3api put-bucket-policy --bucket eceee-media --policy \
          '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::eceee-media/*"]}]}' \
          >/dev/null

volumes:
  test_postgres_data:
  test_redis_data:
  test_minio_data:

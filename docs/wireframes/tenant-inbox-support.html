<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECEEE · Inbox och support · Beteendeskiss</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}header{padding:16px 24px;border-bottom:1px solid GrayText;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header p{margin:0}small,.muted{color:GrayText}button,input,select,textarea{font:inherit;color:inherit;background:Canvas;border:1px solid GrayText;padding:10px}button{cursor:pointer;min-height:44px}button:disabled{cursor:default;opacity:.5}button[aria-current=page]{font-weight:bold;text-decoration:underline}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid CanvasText;outline-offset:3px}nav{position:sticky;top:0;z-index:10;background:Canvas;display:flex;gap:8px;flex-wrap:wrap;padding:16px 24px}main{padding:8px 24px 48px;max-width:960px;margin:auto}h1{font-size:1.7rem}h2{font-size:1.15rem}p{line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;border-bottom:1px solid GrayText}.row p{margin:4px 0}.row button{max-width:100%;text-align:left}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:20px 0}input:not([type=checkbox]),textarea{display:block;width:100%;margin-top:6px}select{max-width:100%}textarea{min-height:100px}video{display:block;width:100%;max-height:360px;margin:16px 0}.placeholder{padding:48px 16px;border:1px dashed GrayText;text-align:center}.message{margin:24px 0}.message p{white-space:pre-wrap}.notice{padding:12px 24px;border-top:1px solid GrayText;min-height:48px}#feedback{position:sticky;bottom:0;background:Canvas}.error{font-weight:bold}code{overflow-wrap:anywhere}form{max-width:720px}@media(max-width:600px){header,nav{padding:12px}main{padding:8px 16px 32px}.row{align-items:flex-start;flex-direction:column}}
</style>
<header><strong>ECEEE · Tenant Exempel</strong><label style="margin:0">Visa som <select id="role"><option value="user">Användare · Anna</option><option value="support">Support · Johan</option></select></label><p><small>Beteendeskiss · exempeldata · allt återställs vid omladdning</small></p></header>
<nav aria-label="Huvudnavigation" id="nav"></nav>
<main id="main"></main>
<div id="feedback" class="notice" role="status" aria-live="polite">Inga filer eller meddelanden skickas. Videokontrollen här sker bara i webbläsaren.</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='user',view='inbox',filter='Alla',clock=10;
const videos=[{id:'v1',title:'Så publicerar du den nya sidan',text:'En instruktion för Tenant Exempel. Filmen finns kvar även när den inte längre är aktuell.',date:'22 oktober · 10:00',order:8,archived:false},{id:'v2',title:'Introduktion till mediebiblioteket',text:'Hitta och återanvänd dina filer.',date:'20 oktober · 14:00',order:1,archived:false}];
const threads=[{id:'t1',title:'Det går inte att spara rubriken',kind:'Felrapport',url:'https://admin.example.invalid/pages/demo/edit',status:'Väntar på användaren',order:9,messages:[{by:'user',text:'Rubriken återställs när jag sparar.',date:'21 oktober · 15:00'},{by:'support',text:'Tack! Prova igen nu och berätta om rubriken finns kvar efter att du sparat.',date:'22 oktober · 10:30'}]}];
const read={user:new Set(),support:new Set()},archived={user:new Set(),support:new Set()},mail=[];
let undo=null;
function tell(s){$('feedback').textContent=s}
function go(v){view=v;render();$('main').focus()}
function entryId(kind,id){return kind+':'+id}
function notify(to,id,title,summary){read[to].delete(id);archived[to].delete(id);mail.unshift({to,id,title,summary});}
function nav(){const n=videos.filter(v=>!read.user.has('v:'+v.id)&&!archived.user.has('v:'+v.id)).length+threads.filter(t=>!read.user.has('t:'+t.id)&&!archived.user.has('t:'+t.id)).length;const tabs=[['inbox','Inbox'+(role==='user'?' ('+n+' olästa)':'')],['library','Instruktionsfilmer'],['new','Fråga eller rapportera fel'],...(role==='support'?[['publish','Publicera instruktion']]:[]),['email','E-postexempel']];$('nav').innerHTML=tabs.map(([v,t])=>`<button data-go="${v}" ${view===v?'aria-current="page"':''}>${t}</button>`).join('')}
function rows(){const entries=[...(role==='user'?videos.map(v=>({id:'v:'+v.id,title:v.title,type:'Instruktion',date:v.date,order:v.order})):[]),...threads.map(t=>({id:'t:'+t.id,title:t.title,type:t.kind,date:t.messages.at(-1).date,order:t.order,status:t.status}))];return entries.filter(e=>filter==='Arkiv'?archived[role].has(e.id):!archived[role].has(e.id)).filter(e=>!['Instruktioner','Support'].includes(filter)||(filter==='Instruktioner'?e.type==='Instruktion':e.type!=='Instruktion')).sort((a,b)=>b.order-a.order)}
function openItem(id){read[role].add(id);go(id)}
function archiveItem(id){archived[role].add(id);undo=id;go('inbox');tell('Arkiverat för dig. Filmen eller tråden finns kvar.');$('feedback').insertAdjacentHTML('beforeend',' <button id="undo">Ångra</button>')}
function render(){nav();const m=$('main');m.tabIndex=-1;
if(view==='inbox'){m.innerHTML=`<h1>${role==='support'?'Supportens inbox':'Din inbox'}</h1><p>Senaste inkomna aktivitet först. ${role==='support'?'Endast Tenant Exempel visas.':'Supporttrådar är privata mellan dig och support.'}</p><div class="filters">${['Alla','Instruktioner','Support','Arkiv'].map(f=>`<button data-filter="${f}" ${filter===f?'aria-current="page"':''}>${f}</button>`).join('')}</div>${rows().map(e=>`<article class="row"><div><small>${e.type} · ${e.date}${e.status?' · '+e.status:''}</small><h2><button data-open="${e.id}">${!read[role].has(e.id)?'Oläst · ':''}${esc(e.title)}</button></h2></div><button data-archive="${e.id}">${filter==='Arkiv'?'Återför till inbox':'Arkivera'}</button></article>`).join('')||'<p>Här finns inga meddelanden.</p><button data-go="new">Ställ en fråga</button>'}`;}
else if(view==='library'){m.innerHTML=`<h1>Instruktionsfilmer</h1><p>Tenant Exempel · senaste publiceringen först. Filmer behålls tills de uttryckligen tas bort.</p><label><input type="checkbox" id="showArchived"> Visa arkiverade filmer</label><div id="filmList"></div>`;drawFilms(false)}
else if(view.startsWith('v:')){const v=videos.find(v=>'v:'+v.id===view);m.innerHTML=`<h1>${esc(v.title)}</h1><p>${esc(v.text)}</p><small>Publicerad ${v.date}${v.archived?' · Arkiverad i biblioteket':''}</small>${v.url?`<video controls src="${v.url}"></video>`:'<div class="placeholder">Videospelare · exempelplats för privat instruktionsfilm<br>Ingen riktig film är inläst i detta exempel.</div>'}<p>Läst meddelande betyder inte att filmen är sedd eller uppgiften utförd.</p><div class="actions"><button id="askFilm">Fråga om filmen</button>${role==='support'?`<button id="archiveFilm">${v.archived?'Återför film':'Arkivera film'}</button>`:''}</div>`;$('askFilm').onclick=()=>newForm(v.id);if($('archiveFilm'))$('archiveFilm').onclick=()=>{v.archived=!v.archived;render();tell('Biblioteket har ändrats i skissen. Filmen finns kvar.')}}
else if(view==='new'){newForm();return}
else if(view==='publish'){publishForm();return}
else if(view.startsWith('t:')){const t=threads.find(t=>'t:'+t.id===view);m.innerHTML=`<h1>${esc(t.title)}</h1><p>${t.kind} · Privat: Anna och behörig support · ${t.status}</p>${t.url?`<p>Plats: <span>${esc(t.url)}</span></p>`:''}${t.film?'<p>Gäller en instruktionsfilm i biblioteket.</p>':''}${t.clip?`<video controls src="${t.clip}"></video>`:''}${t.messages.map(msg=>`<article class="message"><h2>${msg.by==='user'?'Anna':'Johan · Support'} <small>${msg.date}</small></h2><p>${esc(msg.text)}</p></article>`).join('')}<form id="reply"><label>Ditt svar<textarea id="replyText" required maxlength="2000"></textarea></label><button>Skicka svar</button>${role==='support'?` <button type="button" id="resolve">${t.status==='Löst'?'Återöppna':'Markera löst'}</button>`:''}</form>`;$('reply').onsubmit=e=>{e.preventDefault();const text=$('replyText').value.trim();if(!text)return;t.messages.push({by:role,text,date:'Nu'});t.status=role==='support'?'Väntar på användaren':'Öppen';t.order=++clock;notify(role==='support'?'user':'support','t:'+t.id,t.title,'Du har fått ett nytt svar. Läs och svara i ECEEE.');render();tell('Svaret sparades i skissen. En kort e-postavisering visas under E-postexempel.')};if($('resolve'))$('resolve').onclick=()=>{t.status=t.status==='Löst'?'Öppen':'Löst';render();tell('Status ändrad i skissen. Inget extra e-postmeddelande skapas.')};}
else if(view==='email'){m.innerHTML=`<h1>E-postexempel</h1><p>Simulerade personliga aviseringar. Inga riktiga utskick görs. Byt roll för att se mottagarens inbox.</p>${mail.length?mail.map(x=>`<article class="message"><small>Till ${x.to==='user'?'Anna':'Johan · Support'}</small><h2>Nytt meddelande i ECEEE</h2><p>${esc(x.summary)}</p><p><code>/inbox/${x.id.replace(':','/')}?tenant=exempel</code></p><button data-mail-open="${x.id}" data-to="${x.to}">Öppna i mottagarens vy</button><p><small>Logga in för att läsa och svara i systemet. Svara inte på detta e-postmeddelande.</small></p></article>`).join(''):'<p>Publicera en instruktion, skicka en fråga eller svara i en tråd för att se en avisering.</p>'}`;}
}
function drawFilms(show){$('filmList').innerHTML=videos.filter(v=>show||!v.archived).sort((a,b)=>b.order-a.order).map(v=>`<article class="row"><div><small>${v.date}${v.archived?' · Arkiverad':''}</small><h2>${esc(v.title)}</h2></div><button data-open="v:${v.id}">Öppna film</button></article>`).join('')||'<p>Inga publicerade instruktionsfilmer ännu.</p>'}
function newForm(film){view='new';nav();$('main').innerHTML=`<h1>Fråga eller rapportera fel</h1><p>Privat mellan dig och behörig support i Tenant Exempel.</p><form id="newForm"><label>Typ<select id="kind"><option>Felrapport</option><option ${film?'selected':''}>Fråga</option></select></label><label>Kort rubrik<input id="title" required maxlength="150"></label><label>Beskrivning<textarea id="description" required maxlength="2000"></textarea></label><label>Länk till platsen<input id="place" type="url" placeholder="https://…" value="${film?'':'https://admin.example.invalid/pages/demo/edit'}"><small>Exempellänk. I produkten hämtas aktuell plats när formuläret öppnas därifrån.</small></label><section id="uploadSection"><label>Bugginspelning · valfri · högst 5 sekunder<input id="clip" type="file" accept="video/mp4,video/webm"></label><p id="clipState" role="status">Välj en MP4- eller WebM-fil. Ingen fil lämnar webbläsaren.</p><video id="preview" controls hidden></video><button type="button" id="removeClip" hidden>Ta bort bilaga</button><div class="actions"><button type="button" id="simulateLong">Prova fel: video på 6 sekunder</button></div></section><p id="formError" class="error" role="alert"></p><button id="send">Skicka till support</button></form>`;
let clipUrl='',valid=true;$('place').required=!film;
$('kind').onchange=()=>{selection++;$('uploadSection').hidden=$('kind').value==='Fråga';$('place').required=$('kind').value==='Felrapport';valid=true;clipUrl='';$('clip').value='';$('preview').hidden=true;$('clipState').textContent='Ingen bilaga vald.';$('send').disabled=false};
const bad=s=>{valid=false;$('send').disabled=true;$('clipState').textContent=s;$('removeClip').hidden=false};
$('simulateLong').onclick=()=>bad('6,00 sekunder: filmen är för lång. Välj en video på högst 5 sekunder eller ta bort bilagan.');
$('removeClip').onclick=()=>{selection++;valid=true;clipUrl='';$('clip').value='';$('preview').hidden=true;$('clipState').textContent='Bilagan borttagen. Du kan skicka med bara text.';$('send').disabled=false;$('removeClip').hidden=true};
let selection=0;$('clip').onchange=async()=>{const ticket=++selection;const f=$('clip').files[0];if(!f)return;valid=false;$('send').disabled=true;$('removeClip').hidden=false;$('preview').hidden=true;$('clipState').textContent='Kontrollerar videon lokalt…';clipUrl='';if(f.size>25*1024*1024){bad('Skissens exempelgräns är 25 MB. Välj en mindre fil.');return}const url=URL.createObjectURL(f),v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{if(ticket!==selection)return;if(!Number.isFinite(v.duration)||v.duration<=0||v.duration>5){bad('Videon måste ha en läsbar längd på högst 5 sekunder.');URL.revokeObjectURL(url);return}clipUrl=url;valid=true;$('preview').src=url;$('preview').hidden=false;$('clipState').textContent=v.duration.toFixed(2)+' sekunder · lokalt godkänd. Serverkontroll krävs i den riktiga produkten.';$('send').disabled=false};v.onerror=()=>{if(ticket===selection)bad('Videon kunde inte läsas. Välj en annan fil eller ta bort bilagan.')};v.src=url};
$('newForm').onsubmit=e=>{e.preventDefault();if(!valid)return;const title=$('title').value.trim(),text=$('description').value.trim(),url=$('place').value.trim();if(!title||!text)return;if(url&&!/^https?:\/\//i.test(url)){$('formError').textContent='Använd en länk som börjar med https:// eller http://.';return}const t={id:'t'+(threads.length+1),title,kind:$('kind').value,url,status:'Öppen',order:++clock,film,clip:clipUrl,messages:[{by:'user',text,date:'Nu'}]};threads.push(t);read[role].add('t:'+t.id);notify('support','t:'+t.id,title,'En ny fråga eller felrapport väntar i ECEEE.');go('t:'+t.id);tell('Ärendet skapades i skissen. Byt till supportrollen för att svara. Ingen riktig rapport skickades.')};}
function publishForm(){view='publish';nav();$('main').innerHTML=`<h1>Publicera instruktion</h1><p>Mottagare: Tenant Exempel · alla aktiva medlemmar (1 person i skissen).</p><form id="publishForm"><label>Titel<input id="filmTitle" required maxlength="150"></label><label>Kort beskrivning<textarea id="filmText" required maxlength="1000"></textarea></label><label>Instruktionsfilm<input id="filmFile" type="file" accept="video/mp4,video/webm"></label><p>Du kan välja en lokal video eller publicera med exempelplats för video. Instruktionsfilmer får vara längre än 5 sekunder.</p><p>Filmen behålls. Publiceringen skapar en inboxpost och en kort e-postavisering per mottagare.</p><button>Publicera till Tenant Exempel</button></form>`;$('publishForm').onsubmit=e=>{e.preventDefault();const title=$('filmTitle').value.trim(),text=$('filmText').value.trim();if(!title||!text)return;const f=$('filmFile').files[0],v={id:'v'+(videos.length+1),title,text,date:'Nu',order:++clock,archived:false,url:f?URL.createObjectURL(f):''};videos.push(v);notify('user','v:'+v.id,title,'En ny instruktionsfilm finns för din arbetsyta. Öppna ECEEE för att se filmen.');go('v:'+v.id);tell('Publiceringen simulerades. Byt till användarrollen för att se den nya inboxposten.')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.open)openItem(b.dataset.open);if(b.dataset.archive){const id=b.dataset.archive;if(filter==='Arkiv'){archived[role].delete(id);render();tell('Återförd till din inbox.')}else archiveItem(id)}if(b.id==='undo'&&undo){archived[role].delete(undo);undo=null;render();tell('Arkiveringen ångrades.')}if(b.dataset.mailOpen){role=b.dataset.to;$('role').value=role;openItem(b.dataset.mailOpen);tell('Simulerad direktlänk efter inloggning och behörighetskontroll.')}});
document.addEventListener('change',e=>{if(e.target.id==='showArchived')drawFilms(e.target.checked)});
$('role').onchange=()=>{role=$('role').value;filter='Alla';go('inbox');tell('Bytte exempelroll inom Tenant Exempel. Detta är ingen riktig inloggning.')};
render();
</script>
</html>

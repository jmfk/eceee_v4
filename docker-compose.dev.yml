services:
  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: dev.txt
    image: ${BACKEND_IMAGE:-eceee-v4-backend}:latest
    container_name: ${BACKEND_CONTAINER_NAME:-eceee-v4-backend}
    restart: "no"
    environment:
      - DEBUG=1
      - DATABASE_URL=${DATABASE_URL:?Run make configure-local-infra}
      - POSTGRES_DB=${POSTGRES_DB:-eceee_v4}
      - POSTGRES_USER=${POSTGRES_USER:-local_eceee_v4}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Run make configure-local-infra}
      - POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal}
      - POSTGRES_PORT=${POSTGRES_PORT:-10300}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend,testserver
      - CORS_ALLOWED_ORIGINS=http://localhost:${FRONTEND_PORT:-10100},http://127.0.0.1:${FRONTEND_PORT:-10100}
      - CSRF_TRUSTED_ORIGINS=http://localhost:${FRONTEND_PORT:-10100},http://127.0.0.1:${FRONTEND_PORT:-10100}
      - SECRET_KEY=dev-only-secret-key-change-before-production-at-least-50-characters
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-eceee-v4}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?Run make configure-local-infra}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-eceee-media}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-http://localhost:10302}
      - AWS_S3_INTERNAL_ENDPOINT_URL=${AWS_S3_INTERNAL_ENDPOINT_URL:-http://host.docker.internal:10302}
      - AWS_S3_REGION_NAME=us-east-1
      - AWS_S3_USE_SSL=False
      - REDIS_URL=${REDIS_URL:?Run make configure-local-infra}
      - ECEEE_REDIS_NAMESPACE=${ECEEE_REDIS_NAMESPACE:-eceee_v4}
      - IMGPROXY_URL=${IMGPROXY_URL:-http://eceee-v4-imgproxy:8080}
      - IMGPROXY_PUBLIC_URL=http://localhost:${ECEEE_IMGPROXY_PORT:-10106}
      - IMGPROXY_KEY=${IMGPROXY_KEY:?Run make configure-local-infra}
      - IMGPROXY_SALT=${IMGPROXY_SALT:?Run make configure-local-infra}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FM_PASSWORD=${FM_PASSWORD}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY}
      - THEME_SYNC_ENABLED=True
    networks:
      default:
        aliases:
          - public-regression.test
      # eceee_shared:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./docs:/app/docs:ro
      - ./.env:/app/.env
      - backend_static:/app/staticfiles
      - ./backend/media:/app/media
    ports:
      - "127.0.0.1:${BACKEND_PORT:-10101}:8000"
    command: >
      sh -c "python manage.py migrate &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-include '*.html'"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    image: ${FRONTEND_IMAGE:-eceee-v4-frontend}:latest
    container_name: ${FRONTEND_CONTAINER_NAME:-eceee-v4-frontend}
    restart: "no"
    environment:
      - REACT_APP_API_URL=http://localhost:${BACKEND_PORT:-10101}/api
      - REACT_APP_BACKEND_URL=http://localhost:${BACKEND_PORT:-10101}
      - VITE_WS_URL=ws://localhost:${BACKEND_PORT:-10101}
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://backend:8000}
      - VITE_IMGPROXY_URL=http://localhost:${ECEEE_IMGPROXY_PORT:-10106}
      - VITE_DEV_SERVER_PORT=3000
      - VITE_ENABLE_CONTEXT_MENU_TOGGLE=true
      - VITE_GIT_COMMIT_HASH=${VITE_GIT_COMMIT_HASH:-}
      - VITE_USE_POLLING=${VITE_USE_POLLING:-false}
    networks:
      - default
      # - eceee_shared
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - ./docs:/docs:ro
      - ./.git:/repo/.git:ro
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-10100}:3000"
    command: npm run dev -- --host 0.0.0.0
    stdin_open: true
    tty: true

  # Browser regression runner. The image version must match @playwright/test.
  frontend-e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    profiles: ["test"]
    init: true
    ipc: host
    working_dir: /app
    networks:
      - default
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  # Celery worker for background jobs such as site package exports/imports.
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: dev.txt
    image: ${BACKEND_IMAGE:-eceee-v4-backend}:latest
    container_name: ${CELERY_WORKER_CONTAINER_NAME:-eceee-v4-celery-worker}
    restart: "no"
    environment:
      - DEBUG=1
      - DATABASE_URL=${DATABASE_URL:?Run make configure-local-infra}
      - POSTGRES_DB=${POSTGRES_DB:-eceee_v4}
      - POSTGRES_USER=${POSTGRES_USER:-local_eceee_v4}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Run make configure-local-infra}
      - POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal}
      - POSTGRES_PORT=${POSTGRES_PORT:-10300}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend,testserver
      - SECRET_KEY=dev-only-secret-key-change-before-production-at-least-50-characters
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-eceee-v4}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?Run make configure-local-infra}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-eceee-media}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-http://localhost:10302}
      - AWS_S3_INTERNAL_ENDPOINT_URL=${AWS_S3_INTERNAL_ENDPOINT_URL:-http://host.docker.internal:10302}
      - AWS_S3_REGION_NAME=us-east-1
      - AWS_S3_USE_SSL=False
      - REDIS_URL=${REDIS_URL:?Run make configure-local-infra}
      - ECEEE_REDIS_NAMESPACE=${ECEEE_REDIS_NAMESPACE:-eceee_v4}
      - IMGPROXY_URL=${IMGPROXY_URL:-http://eceee-v4-imgproxy:8080}
      - IMGPROXY_PUBLIC_URL=http://localhost:${ECEEE_IMGPROXY_PORT:-10106}
      - IMGPROXY_KEY=${IMGPROXY_KEY:?Run make configure-local-infra}
      - IMGPROXY_SALT=${IMGPROXY_SALT:?Run make configure-local-infra}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FM_PASSWORD=${FM_PASSWORD}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY}
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./docs:/app/docs:ro
      - ./.env:/app/.env
      - ./backend/media:/app/media
    command: celery -A config worker -Q default -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Theme Sync Service
  theme-sync:
    build:
      context: ./theme-sync
      dockerfile: Dockerfile
    image: ${THEME_SYNC_IMAGE:-eceee-v4-theme-sync}:latest
    container_name: ${THEME_SYNC_CONTAINER_NAME:-eceee-v4-theme-sync}
    restart: "no"
    networks:
      - default
      # - eceee_shared
    environment:
      - BACKEND_URL=http://backend:8000
      - TENANT_ID=default  # Tenant identifier (required) - change to your tenant identifier
      - SYNC_INTERVAL=5
      - DEBOUNCE_DELAY=0.5
      - THEMES_DIR=/themes
      - API_TOKEN=8222521226c191dbba22b26b03b6ac417bdab4fe      # JWT token from above
    volumes:
      - ./themes:/themes
      - ./theme-sync:/app
    command: python sync_service.py

volumes:
  backend_static:
  frontend_node_modules:
  mcp_logs:

